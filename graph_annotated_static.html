<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GABAR Graph Construction - Annotated</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            background: white;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>
<!-- Open this in a browser and screenshot it for the Substack post -->
<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

    <!-- Background -->
    <rect width="900" height="420" fill="white"/>

    <!-- Title -->
    <text x="450" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#333">How GABAR Converts a Planning State to a Graph</text>
    <text x="450" y="48" text-anchor="middle" font-size="11" fill="#888">Each object, predicate, and action becomes a node. Edges encode structural relationships.</text>

    <!-- LEFT SIDE: Planning States -->
    <text x="120" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#555">Start State</text>

    <!-- Table surface -->
    <rect x="30" y="210" width="180" height="6" rx="2" fill="#4a90d9" opacity="0.5"/>

    <!-- O2 on table -->
    <rect x="45" y="165" width="60" height="42" rx="8" fill="#fff3b0" stroke="#d4a800" stroke-width="2"/>
    <text x="75" y="191" text-anchor="middle" font-size="14" font-weight="700" fill="#6b5900">O2</text>

    <!-- O3 on O2 -->
    <rect x="45" y="118" width="60" height="42" rx="8" fill="#c8e6c9" stroke="#388e3c" stroke-width="2"/>
    <text x="75" y="144" text-anchor="middle" font-size="14" font-weight="700" fill="#1b5e20">O3</text>

    <!-- O1 on table -->
    <rect x="130" y="165" width="60" height="42" rx="8" fill="#bbdefb" stroke="#1976d2" stroke-width="2"/>
    <text x="160" y="191" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">O1</text>

    <!-- Goal State -->
    <text x="120" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#555">Goal State</text>

    <rect x="30" y="385" width="180" height="6" rx="2" fill="#4a90d9" opacity="0.5"/>

    <!-- Goal: O1 on table -->
    <rect x="45" y="340" width="60" height="42" rx="8" fill="#bbdefb" stroke="#1976d2" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="75" y="366" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">O1</text>

    <!-- Goal: O3 on O1 -->
    <rect x="45" y="293" width="60" height="42" rx="8" fill="#c8e6c9" stroke="#388e3c" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="75" y="319" text-anchor="middle" font-size="14" font-weight="700" fill="#1b5e20">O3</text>

    <!-- Goal: O2 on table -->
    <rect x="130" y="340" width="60" height="42" rx="8" fill="#fff3b0" stroke="#d4a800" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="160" y="366" text-anchor="middle" font-size="14" font-weight="700" fill="#6b5900">O2</text>

    <text x="120" y="408" text-anchor="middle" font-size="10" fill="#999">(dashed = goal)</text>

    <!-- ARROW -->
    <text x="260" y="200" font-size="28" fill="#999">→</text>

    <!-- RIGHT SIDE: Graph -->

    <!-- ===== EDGES (drawn first, behind nodes) ===== -->

    <!-- Action edges (blue) -->
    <!-- Pick-up → O1 -->
    <line x1="430" y1="128" x2="470" y2="210" stroke="#1976d2" stroke-width="2.5" opacity="0.7"/>
    <!-- Unstack → O3 -->
    <line x1="650" y1="128" x2="690" y2="210" stroke="#388e3c" stroke-width="2.5" opacity="0.7"/>
    <!-- Unstack → O2 -->
    <line x1="650" y1="128" x2="580" y2="210" stroke="#d4a800" stroke-width="2.5" opacity="0.5"/>

    <!-- Predicate edges (red/pink) -->
    <!-- Clear(O1) → O1 -->
    <line x1="385" y1="320" x2="470" y2="245" stroke="#1976d2" stroke-width="1.8" opacity="0.5"/>
    <!-- Clear(O3) → O3 -->
    <line x1="810" y1="320" x2="690" y2="245" stroke="#388e3c" stroke-width="1.8" opacity="0.5"/>
    <!-- On(O3,O2) → O3 -->
    <line x1="685" y1="320" x2="690" y2="245" stroke="#388e3c" stroke-width="1.8" opacity="0.5"/>
    <!-- On(O3,O2) → O2 -->
    <line x1="685" y1="320" x2="580" y2="245" stroke="#d4a800" stroke-width="1.8" opacity="0.5"/>
    <!-- G-ON(O3,O1) → O3 -->
    <line x1="535" y1="320" x2="690" y2="245" stroke="#388e3c" stroke-width="1.8" opacity="0.4" stroke-dasharray="5,3"/>
    <!-- G-ON(O3,O1) → O1 -->
    <line x1="535" y1="320" x2="470" y2="245" stroke="#1976d2" stroke-width="1.8" opacity="0.4" stroke-dasharray="5,3"/>

    <!-- ===== NODES ===== -->

    <!-- Action nodes (top row) -->
    <circle cx="430" cy="105" r="30" fill="#4a90d9" stroke="#2d6eb5" stroke-width="2"/>
    <text x="430" y="102" text-anchor="middle" font-size="11" fill="white" font-weight="700">Pick-</text>
    <text x="430" y="115" text-anchor="middle" font-size="11" fill="white" font-weight="700">up</text>

    <circle cx="650" cy="105" r="30" fill="#4a90d9" stroke="#2d6eb5" stroke-width="2"/>
    <text x="650" y="110" text-anchor="middle" font-size="11" fill="white" font-weight="700">Unstack</text>

    <!-- Object nodes (middle row) - color-coded to match blocks -->
    <circle cx="470" cy="225" r="26" fill="#bbdefb" stroke="#1976d2" stroke-width="2.5"/>
    <text x="470" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">O1</text>

    <circle cx="580" cy="225" r="26" fill="#fff3b0" stroke="#d4a800" stroke-width="2.5"/>
    <text x="580" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#6b5900">O2</text>

    <circle cx="690" cy="225" r="26" fill="#c8e6c9" stroke="#388e3c" stroke-width="2.5"/>
    <text x="690" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#1b5e20">O3</text>

    <!-- Predicate nodes (bottom row) -->
    <rect x="340" y="320" width="90" height="30" rx="6" fill="#e63946" stroke="#c1272d" stroke-width="1.5"/>
    <text x="385" y="340" text-anchor="middle" font-size="10.5" fill="white" font-weight="600">Clear(O1)</text>

    <rect x="475" y="320" width="120" height="30" rx="6" fill="#e63946" stroke="#c1272d" stroke-width="1.5" opacity="0.75"/>
    <text x="535" y="340" text-anchor="middle" font-size="10" fill="white" font-weight="600">G-ON(O3,O1)</text>

    <rect x="630" y="320" width="110" height="30" rx="6" fill="#e63946" stroke="#c1272d" stroke-width="1.5"/>
    <text x="685" y="340" text-anchor="middle" font-size="10.5" fill="white" font-weight="600">On(O3,O2)</text>

    <rect x="765" y="320" width="90" height="30" rx="6" fill="#e63946" stroke="#c1272d" stroke-width="1.5"/>
    <text x="810" y="340" text-anchor="middle" font-size="10.5" fill="white" font-weight="600">Clear(O3)</text>

    <!-- ===== ANNOTATIONS ===== -->

    <!-- Annotation: Action-Object edges -->
    <rect x="380" y="148" width="155" height="22" rx="4" fill="#e8f4fd"/>
    <text x="457" y="163" text-anchor="middle" font-size="9.5" fill="#1976d2" font-weight="600">Action-object edges (blue)</text>

    <!-- Annotation: Pred-Object edges -->
    <text x="590" y="295" text-anchor="middle" font-size="9.5" fill="#c1272d" font-weight="600">Predicate-object edges (red)</text>

    <!-- Annotation: Goal predicates -->
    <text x="535" y="365" text-anchor="middle" font-size="9" fill="#999" font-style="italic">dashed = goal predicate</text>

    <!-- Color-coded connection hints -->
    <!-- Arrow from O1 block to O1 node -->
    <path d="M 190 186 C 280 186, 350 225, 444 225" fill="none" stroke="#1976d2" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
    <!-- Arrow from O3 block to O3 node -->
    <path d="M 105 130 C 250 90, 500 160, 664 225" fill="none" stroke="#388e3c" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
    <!-- Arrow from O2 block to O2 node -->
    <path d="M 105 180 C 250 240, 400 260, 554 230" fill="none" stroke="#d4a800" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5"/>

    <!-- LEGEND -->
    <rect x="305" y="380" width="590" height="35" rx="6" fill="#f8f8f8" stroke="#eee" stroke-width="1"/>

    <circle cx="330" cy="397" r="8" fill="#4a90d9"/>
    <text x="345" y="401" font-size="10" fill="#555">Action node</text>

    <circle cx="435" cy="397" r="8" fill="#fff3b0" stroke="#d4a800" stroke-width="1.5"/>
    <text x="450" y="401" font-size="10" fill="#555">Object node</text>

    <rect x="530" y="390" width="16" height="14" rx="3" fill="#e63946"/>
    <text x="553" y="401" font-size="10" fill="#555">Predicate node</text>

    <line x1="650" y1="397" x2="670" y2="397" stroke="#4a90d9" stroke-width="2.5"/>
    <text x="677" y="401" font-size="10" fill="#555">Action edge</text>

    <line x1="750" y1="397" x2="770" y2="397" stroke="#e63946" stroke-width="2"/>
    <text x="777" y="401" font-size="10" fill="#555">Pred edge</text>

    <line x1="840" y1="397" x2="860" y2="397" stroke="#e63946" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="867" y="401" font-size="10" fill="#555">Goal</text>

</svg>
</body>
</html>
